name: Ezeesti
options:
  bundleIdPrefix: ee.ezeesti
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  Ezeesti:
    path: .
targets:
  Ezeesti:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: Ezeesti
        product: EzeestiUI
      - package: Ezeesti
        product: EzeestiCore
      - package: Ezeesti
        product: EzeestiTutor
      - package: Ezeesti
        product: EzeestiLearning
      - package: Ezeesti
        product: EzeestiASR
      - package: Ezeesti
        product: EzeestiLLM
      - package: Ezeesti
        product: EzeestiTTS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ee.ezeesti.app
        PRODUCT_NAME: Ezeesti
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Ezeesti.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_HARDENED_RUNTIME: true
    scheme:
      testTargets: []
